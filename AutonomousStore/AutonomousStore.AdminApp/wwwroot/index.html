<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Store — Painel administrativo</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <meta name="theme-color" content="#f7f5fb" />
</head>

<body>
    <div id="app">
        <div class="loading-indicator">Carregando painel administrativo...</div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- O ?v= existe para o navegador NAO servir a versao velha do cache.
         Sem ele, editar este .js e recompilar nao muda nada na tela: o Chrome
         continua rodando o arquivo antigo, e o sintoma e cruel — a pagina nova
         chamando funcoes que so existem no arquivo novo.
         SUBA O NUMERO sempre que mexer em camera-monitor.js. -->
    <script src="js/camera-monitor.js?v=4"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
